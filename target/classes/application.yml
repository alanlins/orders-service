spring:
  application:
    name: orders-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      security.protocol: SSL
      ssl.truststore.location: file:/app/client.truststore.jks
      ssl.truststore.password: ${SSL_STORE_PASSWORD}
      ssl.keystore.location: file:/app/client.keystore.jks
      ssl.keystore.password: ${SSL_STORE_PASSWORD}
      ssl.key.password: ${SSL_STORE_PASSWORD}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
